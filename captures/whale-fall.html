  <h2>Whale Fall</h2>
  <p>When a large whale dies, its body usually sinks to the floor of the deep sea, where it can feed life in the dark for decades.</p>
  <p class="later">More than 600,000 of them may be down there right now.</p>

<script>
(() => {
'use strict';

/* ================================================================ params */
const Q = new URLSearchParams(location.search);
const T_START = Q.has('t') ? parseFloat(Q.get('t')) : null;   // debug: start at t
const STILL = Q.has('still');                                   // debug: freeze at t
const RENDER = Q.has('render');                                 // external frame driver

/* ================================================================ math */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const scl = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const css = (c, al) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al === undefined ? 1 : al})`;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  for (let i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);

    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
  };
}
const spline = k => mcubic(k.map(p => p[0]), k.map(p => p[1]));

/* ================================================================ timeline */
const FLOOR = 1600;
const TL = {
  song1: 4.5, blow1: 20.1, song2: 25, dive: 31, plunge: 40.5, song3: 44.6, exhale: 52.8, still: 57.5,
  sink: 60, land: 121, city: 131, cityEnd: 226, call: 230.5, rise: 240,
  song4: 257.4, resolve: 265.5, emerge: 268.5, blow2: 271.3, fluke: 279.2, endCard: 286, fin: 304
};
function fallEase(s) {
  const a = 0.16, b = 0.12; s = clamp(s, 0, 1);
  const v = 1 / (1 - a / 2 - b / 2);
  if (s < a) return v * s * s / (2 * a);
  if (s < 1 - b) return v * (a / 2 + (s - a));
  const r = 1 - s; return 1 - v * r * r / (2 * b);
}

/* old whale */
const OW_L = 14, YW_L = 12;
function owSwim(T) { return 1 - ss(TL.exhale, TL.still + 1, T); }
function owZ(T) {
  if (T <= 0) return 26;
  if (T < 17) return lerp(26, 1.9, sm(T / 17));
  if (T < 24) return 1.9 - 1.3 * Math.sin(Math.PI * (T - 17) / 7);
  if (T < TL.dive) return lerp(1.9, 3.2, sm((T - 24) / (TL.dive - 24)));
  if (T < TL.sink) return lerp(3.2, 21, sm((T - TL.dive) / 13));
  if (T < TL.land) return 21 + (FLOOR - 1.4 - 21) * fallEase(fallS(T));

}
const YTAB = (() => { const dt = 0.05, n = Math.ceil(420 / dt) + 2, a = new Float32Array(n); let y = 0; for (let i = 0; i < n; i++) { a[i] = y; const T = i * dt; if (T < TL.sink) y += 1.15 * owSwim(T) * dt; } return a; })();
function owYbase(T) { if (T <= 0) return 0; const f = Math.min(YTAB.length - 2, T / 0.05), i = f | 0; return lerp(YTAB[i], YTAB[i + 1], f - i); }

function owFlip(T, ph, amp) { const swim = 0.6 + 0.07 * Math.sin(ph + 0.7) * amp; return lerp(swim, 0.42, ss(TL.still - 2, TL.sink + 12, T)); }

/* year mapping for the city */
const YK = [[131, Math.log10(1 / 365.25)], [136, Math.log10(3 / 365.25)], [152, Math.log10(0.33)], [168, Math.log10(2)], [188, Math.log10(8)], [212, Math.log10(25)], [226, Math.log10(50)]];
const ylog = spline(YK);
const logYear = T => T < TL.city ? -4 : ylog(Math.min(T, 226));
const lifeAt = lg => ss(-1.25, 1.62, lg);

/* camera keys */
let SK_POS = { x: 0, y: 0, h: 0 };                      // where the bones lie (set at start)
let HAND = [-4.6, 1.2];                                  // left hand centre (local), set by skeleton
const CK = () => [
  [127, 22.4, 0, 0], [140, 20.5, 0, 0.3], [150, 17.5, 0, 1.0], [166, 11.8, 0.2, 2.6],
  [181, 5.3, HAND[0], HAND[1]], [195, 5.9, HAND[0] * 0.96, HAND[1] + 0.15], [214, 21, 0, 0.2], [226, 23, 0, 0], [240, 24, 0, 0]
];
let cityD, cityFX, cityFY;
const riseZ = spline([[240, FLOOR - 24], [244, FLOOR - 42], [247.5, FLOOR - 95], [250.5, FLOOR - 250], [253.5, 700], [256.2, 230], [258.6, 110], [261.5, 27], [264, 12.5], [266.5, 4.2], [268.5, -0.3], [269.6, -8], [271.3, -12.5], [276, -15], [282, -17.5], [292, -22], [306, -30]]);
const ywZs = spline([[248, 175], [262, 42], [266, 24], [269, 13], [271.3, 0.65], [276, 1.1], [279.2, 1.5]]);
function ywZ(T) { return T < TL.fluke ? ywZs(T) : T < TL.fluke + 2.6 ? lerp(1.5, 3.5, ss(TL.fluke, TL.fluke + 2.6, T)) : lerp(3.5, 30, ss(TL.fluke + 2.6, TL.fluke + 9, T)); }
function flukeUp(T) { const t = T - TL.fluke; return t < 0.6 ? 0 : ss(0.6, 2.4, t) * (1 - ss(3.4, 5.2, t)); }

/* ================================================================ canvas */
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, F = 700, HALFDIAG = 1, PORTRAIT = true, ROT0 = 0;
const layer = k => { const c = document.createElement('canvas'); return { c, g: c.getContext('2d'), k }; };
const WL = layer(1), LM = layer(0.25), ML = layer(1), VG = layer(1);
let dprCap = 2;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  PORTRAIT = H >= W * 0.92; ROT0 = PORTRAIT ? 0 : -Math.PI / 2;
  const LONG = PORTRAIT ? H : W, SHORT = PORTRAIT ? W : H;
  F = Math.min(0.6 * LONG / 14, 0.86 * SHORT / 10.8) * 20;
  HALFDIAG = Math.hypot(W, H) / 2;
  for (const L of [WL, ML, VG]) { L.c.width = cv.width; L.c.height = cv.height; L.k = DPR; }
  LM.c.width = Math.ceil(W / 4); LM.c.height = Math.ceil(H / 4); LM.k = 0.25;
  const g = VG.g; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, HALFDIAG * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,4,10,0.42)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  PATS.clear();
}

/* ================================================================ camera / projection */
const cam = { x: 0, y: 0, z: -20, r: 0, cr: 1, sr: 0 };
function setPlane(g, z, k) {
  const s = F / Math.max(0.05, z - cam.z), c = cam.cr, sn = cam.sr;
  const a = s * c, b = -s * sn, cc = -s * sn, d = -s * c;
  g.setTransform(k * a, k * b, k * cc, k * d, k * (W / 2 - a * cam.x - cc * cam.y), k * (H / 2 - b * cam.x - d * cam.y));
  return s;
}
const PT = [0, 0];
function proj(x, y, z) {
  const dd = z - cam.z; if (dd < 0.05) return 0;
  const s = F / dd, dx = (x - cam.x) * s, dy = (y - cam.y) * s;
  PT[0] = W / 2 + dx * cam.cr - dy * cam.sr; PT[1] = H / 2 - (dx * cam.sr + dy * cam.cr);
  return s;
}
const localT = (g, x, y, h) => g.transform(Math.cos(h), -Math.sin(h), Math.sin(h), Math.cos(h), x, y);
function toWorld(lx, ly, P) { const c = Math.cos(P.h), s = Math.sin(P.h); return [P.x + lx * c + ly * s, P.y - lx * s + ly * c]; }

/* ================================================================ textures */
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const GLOWS = new Map();
function glow(col) {
  const key = col.join(','); let c = GLOWS.get(key); if (c) return c;
  c = cnv(64, 64); const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, css(col, 1)); gr.addColorStop(0.16, css(col, 0.6)); gr.addColorStop(0.4, css(col, 0.2)); gr.addColorStop(0.7, css(col, 0.05)); gr.addColorStop(1, css(col, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); GLOWS.set(key, c); return c;
}
const DOT = (() => { const c = cnv(32, 32), g = c.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return c; })();
const HOLE = (() => { const c = cnv(64, 64), g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.9)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c; })();
function vnoise(N, seed) {
  const v = new Float32Array(N * N), r = rng(seed); for (let i = 0; i < N * N; i++) v[i] = r();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const x0 = ((xi % N) + N) % N, y0 = ((yi % N) + N) % N, x1 = (x0 + 1) % N, y1 = (y0 + 1) % N;
    const u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf);
    const a = v[y0 * N + x0], b = v[y0 * N + x1], c = v[y1 * N + x0], d = v[y1 * N + x1];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
}
const CAUSTIC = (() => {
  const n = 256, r = rng(3), P = []; for (let i = 0; i < 24; i++) P.push([r() * n, r() * n]);
  const c = cnv(n, n), g = c.getContext('2d'), img = g.createImageData(n, n), d = img.data;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let f1 = 1e9, f2 = 1e9;
    for (const p of P) { let dx = Math.abs(x - p[0]); dx = Math.min(dx, n - dx); let dy = Math.abs(y - p[1]); dy = Math.min(dy, n - dy); const dd = dx * dx + dy * dy; if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd; }
    const e = Math.sqrt(f2) - Math.sqrt(f1); let v = Math.max(0, 1 - e / 15); v = v * v;
    const i4 = (y * n + x) * 4; d[i4] = 215; d[i4 + 1] = 250; d[i4 + 2] = 255; d[i4 + 3] = Math.min(255, v * 300);
  }
  g.putImageData(img, 0, 0); return c;
})();
const MOTTLE = (() => {
  const n = 256, c = cnv(n, n), g = c.getContext('2d'), img = g.createImageData(n, n), d = img.data;
  const a = vnoise(8, 41), b = vnoise(16, 42), e = vnoise(32, 43), f = vnoise(64, 44);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fx = x / n, fy = y / n, v = 0.45 * a(fx * 8, fy * 8) + 0.3 * b(fx * 16, fy * 16) + 0.15 * e(fx * 32, fy * 32) + 0.1 * f(fx * 64, fy * 64), i4 = (y * n + x) * 4;
    if (v > 0.5) { d[i4] = 0; d[i4 + 1] = 0; d[i4 + 2] = 0; d[i4 + 3] = sm((v - 0.5) / 0.16) * 150; }
    else { d[i4] = 255; d[i4 + 1] = 255; d[i4 + 2] = 255; d[i4 + 3] = sm((0.42 - v) / 0.12) * 70; }
  }

})();
const WAVES_OLD = (() => {
  const n = 256, c = cnv(n, n), g = c.getContext('2d'), img = g.createImageData(n, n), d = img.data;
  const a = vnoise(8, 21), b = vnoise(16, 22), e = vnoise(32, 23), f = vnoise(64, 24);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fx = x / n, fy = y / n;
    const w = 0.4 * a(fx * 8, fy * 8) + 0.3 * b(fx * 16, fy * 16) + 0.2 * e(fx * 32, fy * 32) + 0.1 * f(fx * 64, fy * 64);
    let v = Math.sin((fy * 6 + w * 2.4) * TAU) * 0.5 + 0.5; v = 0.5 + (v - 0.5) * 0.7 + (w - 0.5) * 0.6;
    const i4 = (y * n + x) * 4, q = clamp(v * 255, 0, 255); d[i4] = q; d[i4 + 1] = q; d[i4 + 2] = q; d[i4 + 3] = 255;
  }
  g.putImageData(img, 0, 0); return c;
})();
const WAVES = (() => {
  const n = 256, c = cnv(n, n), g = c.getContext('2d'), img = g.createImageData(n, n), d = img.data;
  const A1 = vnoise(4, 21), A2 = vnoise(8, 22), A3 = vnoise(16, 23), A4 = vnoise(32, 24), B1 = vnoise(8, 25);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fx = x / n, fy = y / n, wx = fx + 0.05 * (B1(fx * 8, fy * 8) - 0.5);
    let v = 0.42 * Math.sin((fy * 24 + 3 * A2(wx * 8, fy * 8)) * TAU) + 0.3 * Math.sin((fy * 40 + wx * 6 + 4 * A3(wx * 16, fy * 16)) * TAU) + 0.55 * (A4(wx * 32, fy * 32) - 0.5);
    v *= 0.5 + 0.9 * A1(fx * 4, fy * 4);
    const q = clamp(128 + v * 64, 0, 255), i4 = (y * n + x) * 4; d[i4] = q; d[i4 + 1] = q; d[i4 + 2] = q; d[i4 + 3] = 255;
  }
  g.putImageData(img, 0, 0); return c;
})();
const SED = (() => {
  const S = 512, c = cnv(S, S), g = c.getContext('2d'), img = g.createImageData(S, S), d = img.data;
  const n = [vnoise(6, 11), vnoise(12, 12), vnoise(24, 13), vnoise(48, 14), vnoise(96, 15)], wt = [0.4, 0.26, 0.17, 0.1, 0.07], fr = [6, 12, 24, 48, 96];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const fx = x / S, fy = y / S; let v = 0;
    for (let k = 0; k < 5; k++) v += wt[k] * n[k](fx * fr[k], fy * fr[k]);
